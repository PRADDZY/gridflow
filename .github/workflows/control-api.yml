name: GridFlow validation

on:
  push:
    paths:
      - "services/control-api/**"
      - "gateway/**"
      - "apps/control-room/**"
      - ".github/workflows/control-api.yml"
  pull_request:
    paths:
      - "services/control-api/**"
      - "gateway/**"
      - "apps/control-room/**"
      - ".github/workflows/control-api.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the Control API after validation"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  control-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          working-directory: services/control-api
      - run: uv sync --all-groups
      - run: uv run python -m pytest
      - run: uv run pywrangler sync

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          working-directory: gateway
      - run: uv sync --all-groups
      - run: uv run python -m pytest
      - run: uv run python -m compileall -q src

  control-room:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-room
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/control-room/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: control-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-api
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: services/control-api
      - run: uv sync --all-groups
      - run: uv run pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
