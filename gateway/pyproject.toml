[project]
name = "gridflow-edge-gateway"
version = "0.1.0"
description = "Public-camera reference analytics gateway with local vehicle inference"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
vision = [
    "opencv-python-headless>=4.10,<5",
    "pillow>=11,<12",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "transformers>=5.0,<6",
]

[project.scripts]
gridflow-gateway = "gridflow_gateway.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridflow_gateway"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]
